# PROD config (Phase 9): TLS + per-buoy credentials + topic ACLs.
# Generate certs:   bash infra/scripts/gen_certs.sh <broker-hostname>
# Create users:     mosquitto_passwd -c infra/mosquitto/passwd SS-B01
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Internal listener for engine/api inside the docker network (not published)
listener 1883 0.0.0.0

# Public TLS listener for buoys
listener 8883
cafile   /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile  /mosquitto/config/certs/server.key
tls_version tlsv1.2

log_dest stdout
