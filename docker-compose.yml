# SeaShield AI: full stack on one host (local dev or one Vultr VPS).
#   docker compose up -d --build              # live demo stack
#   docker compose --profile db up -d         # + PostgreSQL (persistence, not used by the demo yet)
name: seashield

x-python: &python
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./secrets:/app/secrets:ro

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      # Reachable from THIS machine only (127.0.0.1), never from the internet.
      - "127.0.0.1:1883:1883"
    # Remote buoys (later): mosquitto.prod.conf with TLS on 8883 + per-buoy credentials.

  engine:
    <<: *python
    command: python -m seashield.engine
    depends_on: [mosquitto]

  api:
    <<: *python
    command: uvicorn seashield.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    depends_on: [mosquitto]

  simulator:
    <<: *python
    # Live demo: real NOAA data, calm days then Hurricane Helene (Sept 2024), looping forever.
    # 1 historical hour every 2 s -> one loop of 5 days takes ~4 minutes.
    command: >
      python -m seashield.simulator --start 2024-09-23T00:00 --end 2024-09-28T00:00 --interval 2 --loop
    volumes:
      - ./secrets:/app/secrets:ro
      - ./data:/app/data:ro
    depends_on: [mosquitto, engine]

  web:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on: [api]

  postgres:
    image: postgres:16
    profiles: ["db"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
  caddy_data:
