[project]
name = "seashield"
version = "0.1.0"
description = "SeaShield AI: detecting False Data Injection attacks on ocean-monitoring buoys"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "paho-mqtt>=2.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
    "cryptography>=42",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "amqtt>=0.12"]  # amqtt: local MQTT broker without Docker
ml = ["matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seashield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
